on:
  push:
    branches:
      - main
  # Manually publish the current version on main, e.g. if a release's publish step failed.
  workflow_dispatch:

permissions:
  contents: write
  pull-requests: write
  issues: write
  id-token: write

name: release-please

jobs:
  release-please:
    runs-on: ubuntu-latest
    steps:
      - uses: googleapis/release-please-action@v4
        id: release
        with:
          release-type: node
      - uses: actions/checkout@v6
        if: ${{ steps.release.outputs.release_created || github.event_name == 'workflow_dispatch' }}
      - uses: actions/setup-node@v6
        with:
          node-version: lts/*
          registry-url: https://registry.npmjs.org
        if: ${{ steps.release.outputs.release_created || github.event_name == 'workflow_dispatch' }}
      - run: |
          npm ci
          npm publish
        if: ${{ steps.release.outputs.release_created || github.event_name == 'workflow_dispatch' }}
